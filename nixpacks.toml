[phases.setup]
nixPkgs = ["nodejs-18_x", "npm-9_x"]

[phases.install]
cmds = [
    "npm ci",
    "cd kuer && npm ci"
]

[phases.build]
cmds = [
    "cd kuer && npm run build",
    "npm run build"
]

[start]
cmd = "node start-railway.js"

[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"