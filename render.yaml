# Render deployment configuration
services:
  # Strapi Backend Service
  - type: web
    name: kuer-strapi-backend
    env: node
    plan: free  # or starter, standard, pro
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: APP_KEYS
        generateValue: true  # Render will generate secure keys
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: kuer-postgres
          property: connectionString
      - key: STRAPI_URL
        value: https://kuer-strapi-backend.onrender.com
      - key: SERVE_ADMIN_PANEL
        value: true

  # Frontend Service (if deploying separately)
  - type: web
    name: kuer-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_STRAPI_URL
        value: https://kuer-strapi-backend.onrender.com
      - key: SKIP_STRAPI_BUILD
        value: true
      # Add your Appwrite variables
      - key: NEXT_PUBLIC_APPWRITE_PROJECT_ID
        value: 68c7e7bc0028f9acee36
      - key: NEXT_PUBLIC_APPWRITE_ENDPOINT
        value: https://fra.cloud.appwrite.io/v1
      - key: NEXT_PUBLIC_APPWRITE_DB_ID
        value: 68c7f25e00083a6d2992

# Database
databases:
  - name: kuer-postgres
    plan: free  # 1GB free tier
    databaseName: kuer
    user: kuer